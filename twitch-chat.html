<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Twitch Chat</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
        }

        #chat {
            position: fixed;
            inset: 0;
            padding: 10px 14px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 4px;
            overflow: hidden;

            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            line-height: 1.45;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .9), 0 0 4px rgba(0, 0, 0, .7);
        }

        .m {
            word-break: break-word;
            overflow-wrap: anywhere;
            animation: fade .2s ease;
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .u {
            font-weight: 700;
            margin-right: 5px;
        }
    </style>
</head>

<body>

    <div id="chat"></div>

    <script>
        (function () {
            // ── Read channel from URL (?channel=xxx or #xxx)
            var DEFAULT_CHANNEL = 'twitch';
            var params = new URLSearchParams(window.location.search);
            var CHANNEL = (
                params.get('channel') ||
                params.get('c') ||
                (window.location.hash ? window.location.hash.slice(1) : '') ||
                DEFAULT_CHANNEL
            ).trim().toLowerCase();

            var TWITCH_WS = 'wss://irc-ws.chat.twitch.tv:443';
            var MAX = 100;

            var box = document.getElementById('chat');

            function addLine(text, color) {
                var d = document.createElement('div');
                d.className = 'm';
                d.style.color = color || '#fff';
                d.textContent = text;
                box.appendChild(d);
                while (box.children.length > MAX) box.removeChild(box.firstChild);
            }

            function render(username, color, text) {
                var row = document.createElement('div');
                row.className = 'm';

                var user = document.createElement('span');
                user.className = 'u';
                user.textContent = username + ':';
                if (color) user.style.color = color;
                row.appendChild(user);

                var t = document.createElement('span');
                t.textContent = text;
                row.appendChild(t);

                box.appendChild(row);
                while (box.children.length > MAX) box.removeChild(box.firstChild);
            }

            // ── Parse IRCv3 tags from a raw IRC line
            function parseTags(raw) {
                var tags = {};
                if (raw.charAt(0) !== '@') return tags;

                var spaceIdx = raw.indexOf(' ');
                var tagStr = raw.slice(1, spaceIdx);
                raw = raw.slice(spaceIdx + 1);

                tagStr.split(';').forEach(function (pair) {
                    var eq = pair.indexOf('=');
                    if (eq === -1) {
                        tags[pair] = '';
                    } else {
                        var key = pair.slice(0, eq);
                        var val = pair.slice(eq + 1)
                            .replace(/\\s/g, ' ')
                            .replace(/\\:/g, ';')
                            .replace(/\\\\/g, '\\');
                        tags[key] = val;
                    }
                });

                return { tags: tags, rest: raw };
            }

            // ── Parse PRIVMSG
            function handlePrivmsg(raw) {
                var parsed = parseTags(raw);
                if (!parsed.tags) return;

                var tags = parsed.tags;
                var rest = parsed.rest;

                // Format: :nick!nick@nick.tmi.twitch.tv PRIVMSG #channel :message
                var match = rest.match(/^:([^!]+)![^ ]+ PRIVMSG [^ ]+ :(.+)$/);
                if (!match) return;

                var username = tags['display-name'] || match[1];
                var color = tags.color || '';
                var text = match[2];

                render(username, color, text);
            }

            // ── Connect
            var ws = new WebSocket(TWITCH_WS);

            ws.onopen = function () {
                console.log('[Twitch] Connected');
                // Request tags + commands for metadata
                ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
                // Anonymous login — justinfan + random number
                var nick = 'justinfan' + Math.floor(Math.random() * 80000 + 1000);
                ws.send('PASS SCHMOOPIIE');
                ws.send('NICK ' + nick);
                // Join the channel
                ws.send('JOIN #' + CHANNEL);
            };

            ws.onmessage = function (ev) {
                // A single WebSocket frame can contain multiple IRC lines
                var lines = ev.data.split('\r\n');
                lines.forEach(function (line) {
                    if (!line) return;

                    // Respond to PING to keep the connection alive
                    if (line.indexOf('PING') === 0) {
                        ws.send('PONG :tmi.twitch.tv');
                        return;
                    }

                    // Chat message
                    if (line.indexOf('PRIVMSG') !== -1) {
                        handlePrivmsg(line);
                    }
                });
            };

            ws.onerror = function () {
                addLine('WebSocket error', '#ff5252');
            };

            ws.onclose = function (ev) {
                console.log('[Twitch] Closed', ev.code);
                addLine('Connection closed (' + ev.code + ')', '#ff5252');
            };

            console.log('[Twitch] Starting for channel:', CHANNEL);
        })();
    </script>

</body>

</html>
