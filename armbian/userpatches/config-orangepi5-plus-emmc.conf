# userpatches/config-orangepi5-plus-emmc.conf
#
# Builds an Armbian image that auto-installs itself to eMMC on first boot.
# Run with: ./build.sh orangepi5-plus-emmc
#
# This config inherits everything from the base config except the customize
# script, which is overridden to point at customize-image-emmc.sh.

# --- Target ---
BOARD=orangepi5-plus
BRANCH=current
RELEASE=noble

# --- Build options ---
BUILD_MINIMAL=yes
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no
INSTALL_HEADERS=yes
SHARE_LOGS=yes

VENDOR=Armbian_Belabox_duo_EMMC

# --- Networking ---
NAMESERVER=$(grep nameserver /etc/resolv.conf | awk '{ print $2 }' | head -n 1)

BUILD_VARIANT="emmc"