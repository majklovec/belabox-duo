# userpatches/config-orangepi5-plus.conf
#
# Run with: ./compile.sh orangepi5-plus
#
# See: https://docs.armbian.com/Developer-Guide_Build-Switches/

# --- Target ---
BOARD=orangepi5-plus      # Orange Pi 5 Plus (Rockchip RK3588)
BRANCH=current            # Latest mainline Linux LTS kernel
RELEASE=noble             # resolut nema rockchip-multimedia  

# --- Build options ---
BUILD_MINIMAL=yes         # Minimal CLI set
BUILD_DESKTOP=no          # No graphical desktop
KERNEL_CONFIGURE=no       # Skip kernel config prompt
INSTALL_HEADERS=no        # Install kernel headers
SHARE_LOGS=yes            # Upload logs to Armbian paste

VENDOR=Armbian_Belabox_duo

# --- Networking ---
# Use the build host's DNS server inside the chroot.
NAMESERVER=$(grep nameserver /etc/resolv.conf | awk '{ print $2 }' | head -n 1)

BUILD_VARIANT="sd"