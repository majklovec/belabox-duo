<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings - Belabox Duo</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1><a href="../" title="Back to device">←</a> Device settings</h1>
      <span id="conn" class="badge off">disconnected</span>
    </header>
    <main>
      <section class="card">
        <p class="muted">Hostname, role and control-server changes take effect after restarting the service.</p>
        <form id="settings-form">
          <label>Hostname <input name="hostname" pattern="[A-Za-z0-9][A-Za-z0-9.-]{0,62}" /></label>
          <label>Role
            <select name="role">
              <option value="">Keep current</option>
              <option value="relay">Relay</option>
              <option value="encoder">Encoder</option>
              <option value="combined">Combined</option>
            </select>
          </label>
          <label>Control server URL <input name="remoteUrl" placeholder="wss://control.example/device" /></label>
          <label>Remote token <input name="remoteToken" type="password" autocomplete="off" placeholder="unchanged" /></label>
          <label>Header color <input name="color" type="color" value="#0f1115" /></label>
          <div class="actions"><button type="submit" id="save">Save settings</button></div>
        </form>
        <p id="result" class="muted" role="status"></p>
      </section>
    </main>
    <script type="module" src="ts/settings.ts"></script>
  </body>
</html>
