<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Belabox Duo</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>
        <a id="back" href="../../" title="All devices" hidden>←</a>
        Belabox Duo <span id="device-name" class="muted"></span>
      </h1>
      <span class="actions">
        <label
          class="check"
          title="Resume the last stream when the service starts"
          ><input type="checkbox" id="autostart" /> Autostart</label
        >
        <span id="role" class="badge" hidden></span>
        <span id="conn" class="badge off">disconnected</span>
      </span>
    </header>

    <main>
      <section class="card" id="encoder" hidden>
        <h2 id="encoder-title">Encoder</h2>
        <dl id="encoder-info"></dl>
        <form id="encoder-form">
          <label
            >Pipeline
            <select name="pipeline" id="pipeline" required></select
          ></label>

          <label id="asrc-field" hidden
            >Audio source
            <select name="audioSource" id="audio-source"></select
          ></label>
          <label id="acodec-field" hidden
            >Audio codec
            <select name="audioCodec" id="audio-codec">
              <option value="aac">AAC</option>
              <option value="opus">Opus</option>
            </select></label
          >
          <label
            >Audio delay (ms)
            <input
              name="delay"
              type="number"
              min="-2000"
              max="2000"
              placeholder="0"
          /></label>
          <label id="overlay-field" class="check" hidden
            ><input
              type="checkbox"
              name="bitrateOverlay"
              id="bitrate-overlay"
            />
            Bitrate overlay</label
          >
          <label id="encoder-host-field"
            >Relay host <input name="host" placeholder="192.168.1.10" required
          /></label>
          <label id="encoder-port-field"
            >Relay SRT port
            <input name="port" inputmode="numeric" placeholder="6000" required
          /></label>
          <label
            >Max bitrate (kbps)
            <input
              name="maxBitrate"
              type="number"
              min="300"
              max="30000"
              step="100"
              placeholder="5000"
          /></label>
          <label
            >SRT latency (ms)
            <input
              name="latency"
              type="number"
              min="100"
              max="10000"
              step="100"
              placeholder="2000"
          /></label>

          <label
            >Stream ID <input name="streamid" placeholder="optional"
          /></label>
          <div class="actions">
            <button type="submit" id="encoder-start">Start</button>
            <button type="button" id="encoder-stop" class="danger">Stop</button>
            <button type="button" id="encoder-bitrate" class="secondary">
              Apply bitrate
            </button>
          </div>
        </form>
      </section>

      <section class="card" id="srtla">
        <h2>SRTLA</h2>
        <dl id="srtla-info"></dl>
        <form id="srtla-form">
          <label id="srtla-listen-field"
            >Listen port
            <input
              name="listenPort"
              inputmode="numeric"
              placeholder="6000"
              required
          /></label>
          <label
            ><span id="srtla-host-label">Remote host</span>
            <input name="remoteHost" placeholder="rec.example.com" required
          /></label>
          <label
            ><span id="srtla-port-label">Remote port</span>
            <input
              name="remotePort"
              inputmode="numeric"
              placeholder="5000"
              required
          /></label>
          <div class="actions" id="srtla-actions">
            <button type="submit" id="srtla-start">Start</button>
            <button type="button" id="srtla-stop" class="danger">Stop</button>
            <button type="button" id="srtla-reload">Reload</button>
          </div>
        </form>
        <form id="srtla-options" class="inline options">
          <label
            >Scheduler
            <select id="srtla-mode">
              <option value="enhanced">Enhanced</option>
              <option value="classic">Classic</option>
            </select></label
          >
          <label
            class="check"
            title="Score links by RTT, loss and NAKs (enhanced scheduler only)"
            ><input type="checkbox" id="srtla-quality" /> Quality scoring</label
          >
        </form>
      </section>

      <section class="card" id="interfaces">
        <div class="card-head">
          <h2>Interfaces</h2>
          <div class="actions">
            <span id="links-age" class="muted" hidden></span>
            <button type="button" id="reconfigure">Reconfigure</button>
          </div>
        </div>

        <table id="iface-table" class="no-stats">
          <thead>
            <tr>
              <th>Bond</th>
              <th>Interface</th>
              <th>Signal</th>
              <th>Network</th>
              <th class="link-col">Link</th>
              <th class="link-col">Bitrate</th>
              <th class="link-col">RTT</th>
              <th
                class="link-col"
                title="Packets in flight / congestion window"
              >
                In flight
              </th>
              <th class="link-col">NAKs</th>
              <th class="link-col">Loss</th>
              <th class="link-col">Quality</th>
            </tr>
          </thead>
          <tbody id="iface-rows"></tbody>
        </table>
      </section>

      <section class="card" id="modems">
        <h2>Modems</h2>
        <div id="modem-list" class="grid"></div>
      </section>

      <section class="card" id="log-card">
        <h2>Log</h2>
        <code id="log"></code>
      </section>
    </main>

    <script type="module" src="ts/app.ts"></script>
  </body>
</html>
