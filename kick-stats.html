<html lang="en">
<header>
  <script src="https://pixlcore.com/software/pixl-chart/chart.min.js"></script>
</header>

<body>
  <!-- <iframe
          id="kick-embed"
          frameborder="0"
          src="about:blank"
          allowfullscreen
          width="200"
        >
        </iframe> -->
  <div id="session-title"></div>
  <div id="category"></div>
  <div id="viewers-count"></div>
  <div id="session-start-time"></div>
  <div id="duration"></div>
  <canvas width="1000" height="400" class="chart" id="c1"></canvas>

  <script>
    var channel = "cicero_mt";
    var VIEWERS_POLL_MS = 10000;

    var chart = new Chart({
      canvas: "#c1",
      legend: false,
      dataType: "integer",
      layers: [
        {
          title: "Lidi",
          data: [],
        },
      ],
    });
    chart.render();

    // document.getElementById("kick-embed").src =
    //   `https://player.kick.com/${channel}`;

    function updateViewers() {
      fetch(`https://kick.com/api/v1/channels/${channel}`, {
        cache: "no-store",
      })
        .then((response) => response.json())
        .then((data) => {
          var viewers = data.livestream ? data.livestream.viewers : null;
          var session_title = data.livestream
            ? data.livestream.session_title
            : "Offline";
          var category = data.livestream
            ? data.livestream.categories[0].name
            : "Offline";
          var start_time = data.livestream
            ? new Date(data.livestream.start_time)
            : null;

          chart.addLayerSample(
            0,
            {
              x: Math.floor(Date.now() / 1000),
              y: viewers === null ? 0 : viewers,
            },
            10000000,
          );

          document.getElementById("session-title").textContent =
            session_title;
          document.getElementById("category").textContent = category;
          document.getElementById("viewers-count").textContent =
            viewers === null ? "Offline" : `Viewers: ${viewers}`;
          document.getElementById("session-start-time").textContent =
            start_time ? `Začátek: ${start_time.toLocaleString()}` : "";
          document.getElementById("duration").textContent = start_time
            ? `Délka: ${Math.floor((Date.now() - start_time) / 60000)} minutes`
            : "";
        })
        .catch((error) => console.error("Je to rozbitý:", error));
    }

    updateViewers();
    setInterval(updateViewers, VIEWERS_POLL_MS);
  </script>
</body>

</html>
