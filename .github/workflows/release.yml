name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  # ------------------------------------------------------------------
  # 1. Compute next semver from Conventional Commits and push the tag.
  #    Skipped entirely if there is no feat/fix/perf/BREAKING change.
  # ------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      changed: ${{ steps.tag.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: tag
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          RELEASE_BRANCHES: main

  # ------------------------------------------------------------------
  # 2. Build compiled binaries for every target.
  # ------------------------------------------------------------------
  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: obs-client-linux-x64
            client-artifact: client-linux-x64
            native: true
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: obs-client-linux-arm64
            client-artifact: client-linux-arm64
            native: false
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: obs-client-darwin-arm64
            client-artifact: client-darwin-arm64
            native: true
          # bun-windows-x64 (cross-compiled from Linux) is temporarily
          # disabled — see original note in git history.

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate frontend module manifest
        run: bun run gen:modules

      - name: Build profiling binaries (native only)
        if: matrix.native == true
        run: |
          for app in obs-client client; do
            bun build --compile --minify --sourcemap \
              --target=${{ matrix.target }} \
              ./${app}.ts \
              --outfile ${app}-prof
          done

      - name: Record bytecode profiles (native only)
        if: matrix.native == true
        run: |
          BUN_BYTECODE_ORDER_OUT=obs-client.order ./obs-client-prof --help
          BUN_BYTECODE_ORDER_OUT=client.order ./client-prof --help

      - name: Build final binaries
        run: |
          for app in obs-client client; do
            case $app in
              client) OUTIF=${{ matrix.client-artifact }} ;;
              *)      OUTIF=${{ matrix.artifact }} ;;
            esac

            ARGS="--compile --minify --sourcemap --bytecode \
              --target=${{ matrix.target }} \
              ./${app}.ts \
              --outfile $OUTIF"

            if [ -f ${app}.order ]; then
              ARGS="$ARGS --bytecode-order=${app}.order"
            fi

            bun build $ARGS
          done

      - name: Verify binaries (native only)
        if: matrix.native == true
        run: |
          chmod +x ${{ matrix.artifact }} ${{ matrix.client-artifact }}
          ./${{ matrix.artifact }} --help
          ./${{ matrix.client-artifact }} --help

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.client-artifact }}

  # ------------------------------------------------------------------
  # 3. Control server Docker image → ghcr.io/<owner>/<repo>-server:<tag>
  # ------------------------------------------------------------------
  publish-server-docker:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}-server:${{ needs.version.outputs.new_tag }}
            ghcr.io/${{ github.repository }}-server:latest

  # ------------------------------------------------------------------
  # 4. Publish the GitHub Release for the tag created in job 1.
  #    The tag already exists, so softprops just attaches the files.
  # ------------------------------------------------------------------
  release:
    needs: [version, build, publish-server-docker]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          files: artifacts/**/*
          generate_release_notes: true
