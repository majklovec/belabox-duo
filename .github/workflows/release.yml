name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          # Native builds – profile step is safe
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: obs-client-linux-x64
            client-artifact: client-linux-x64
            native: true
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: obs-client-linux-arm64
            client-artifact: client-linux-arm64
            native: false
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: obs-client-darwin-arm64
            client-artifact: client-darwin-arm64
            native: true
          # Cross‑compiled from Ubuntu – skip profile generation
          - os: ubuntu-latest
            target: bun-windows-x64
            artifact: obs-client-windows-x64.exe
            client-artifact: client-windows-x64.exe
            native: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # ---------------------------------------------------------------
      # Step 1: build “profiling” binaries WITHOUT bytecode, then run
      #         them to capture the bytecode order. Only for native
      #         targets.
      # ---------------------------------------------------------------
      - name: Build profiling binaries (native only)
        if: matrix.native == true
        run: |
          for app in obs-client client; do
            bun build --compile --minify --sourcemap \
              --target=${{ matrix.target }} \
              ./${app}.ts \
              --outfile ${app}-prof
          done

      - name: Record bytecode profiles (native only)
        if: matrix.native == true
        run: |
          BUN_BYTECODE_ORDER_OUT=obs-client.order ./obs-client-prof --help
          BUN_BYTECODE_ORDER_OUT=client.order ./client-prof --help

      # ---------------------------------------------------------------
      # Step 2: final build with bytecode. For native targets we include
      #         the .order file; for cross‑compiled targets we omit it.
      # ---------------------------------------------------------------
      - name: Build final binaries
        run: |
          for app in obs-client client; do
            case $app in
              client) OUTIF=${{ matrix.client-artifact }} ;;
              *)      OUTIF=${{ matrix.artifact }} ;;
            esac

            ARGS="--compile --minify --sourcemap --bytecode \
              --target=${{ matrix.target }} \
              ./${app}.ts \
              --outfile $OUTIF"

            if [ -f ${app}.order ]; then
              ARGS="$ARGS --bytecode-order=${app}.order"
            fi

            bun build $ARGS
          done

      - name: Verify binaries (native only)
        if: matrix.native == true
        run: |
          chmod +x ${{ matrix.artifact }} ${{ matrix.client-artifact }}
          ./${{ matrix.artifact }} --help
          ./${{ matrix.client-artifact }} --help

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.client-artifact }}

  # -------------------------------------------------------------------
  # Control server as a Docker image (Dockerfile in the repo root):
  # ghcr.io/<owner>/<repo>-server:<tag> and :latest
  # -------------------------------------------------------------------
  publish-server-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}-server:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-server:latest

  release:
    needs: [build, publish-server-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
