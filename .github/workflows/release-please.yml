name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Only create the tag. Your Release.yml does the actual
          # GitHub Release (binaries + generated notes).
          skip-github-release: true
          # Commit the version bump + CHANGELOG directly to main and
          # create the tag — no release PR is created.
          skip-github-pull-request: true
